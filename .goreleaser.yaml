version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: chromesnap
    main: ./cmd/chromesnap
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.goVersion={{.Env.GO_VERSION}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.zh-cn.md

checksum:
  name_template: checksums.txt

upx:
  - enabled: true
    goos: [linux]
    goarch: [amd64, arm64]
    compress: "9"
    lzma: true

release:
  github:
    owner: normal-coder
    name: chromesnap

homebrew_casks:
  - name: chromesnap
    directory: Casks
    repository:
      owner: normal-coder
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    url:
      verified: github.com/normal-coder/chromesnap
    homepage: https://github.com/normal-coder/chromesnap
    description: Headless Chrome screenshot CLI and Go library
    license: MIT
    postflight: |
      system_command "/usr/bin/xattr",
                     args: ["-d", "com.apple.quarantine", "#{staged_path}/chromesnap"],
                     sudo: false
